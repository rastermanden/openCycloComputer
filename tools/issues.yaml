- title: M6 Strøm & batterilevetid
  description: Estimaterne i strømbudgettet skiftes ud med målinger, og firmware sover mellem prøverne.
- title: M7 Navigation & sync
  description: 'Senere spor: rutevisning og en vej til telefon, Strava eller Garmin Connect. Kun skitser
